# harness template for rootstock (https://github.com/bodasooqa/rootstock).
# How it works — docs/design.md, section "Template".
schema = 1
root = "template"
# Only files with the `.jinja` suffix are rendered, the rest are copied as is:
# TSX and CSS can contain `{{`, which Jinja would take for a substitution.
suffix = ".jinja"

[jinja]
keep_trailing_newline = true
lstrip_blocks = true
trim_blocks = true

# Partial files for include: an agent's body is shared by Claude Code and Pi.
# include resolves from the repository root, not from `template/`, so it is
# written with the `template/_partials/` prefix.
#
# Starter files are created once and then belong to the project: an update
# leaves them alone, and a starter file the project deleted does not come back.
# Path templates are rendered with the answers.
[files]
exclude = ["_partials"]
starter = [
  "/README.md",
  # Project rules for all agents live in AGENTS.md; CLAUDE.md only imports it
  # and the process rules for Claude Code.
  "/AGENTS.md",
  "/CLAUDE.md",
  "/.gitignore",
  # The project's own where it already existed (screener): as a starter file it
  # is not overwritten on update, and a project without one gets it created.
  "/.gitattributes",
  "openspec/config.yaml",
  # Harness extension points: the project's own hooks, git hooks, CI jobs
  ".harness/local/**",
  "/lefthook.yml",
  ".github/workflows/ci.yml",
  # Rust
  "/Cargo.toml",
  "crates/app/**",
  # Frontend
  "/package.json",
  "/biome.json",
  "apps/web/**",
  "packages/uikit/**",
  # A single crate or a single app at the root
  "/src/**",
  "/index.html",
  "/vite.config.ts",
  "/tsconfig.json",
  "/components.json",
  # Documents of the new form
  "{% if spec_path %}{{ spec_path }}/**{% endif %}",
  "{% if revisions_path %}{{ revisions_path }}/**{% endif %}",
  "{% if decisions_path %}{{ decisions_path }}/**{% endif %}",
  "{% if lessons_path %}{{ lessons_path }}/**{% endif %}",
  "{% if open_questions_path %}{{ open_questions_path }}{% endif %}",
  "knowledge/README.md",
]

[[hooks]]
when = ["new"]
run = 'if command -v openspec >/dev/null 2>&1; then openspec init --tools claude,pi --no-animation; else echo "harness: openspec not found in PATH, run openspec init --tools claude,pi in the project" >&2; fi'

# Git hooks (lefthook). Installed only if the project already has its own
# repository (`.git` at the root): otherwise `lefthook install` would find an
# enclosing repository and install the hooks there. rootstock 0.1 runs
# `git init` (`--git`) after the template tasks, so usually the task only
# reminds — loudly, not silently as before: without hooks pre-commit and
# pre-push don't work. In a frontend project lefthook comes with `bun install`
# (`bunx lefthook install`).
[[hooks]]
when = ["new"]
run = 'if [ -e .git ] && command -v lefthook >/dev/null 2>&1; then lefthook install || echo "harness: lefthook install failed, run it in the project" >&2; elif command -v lefthook >/dev/null 2>&1; then echo "harness: git hooks not installed — there is no repository yet. After git init run lefthook install in the project" >&2; else echo "harness: lefthook not found in PATH, git hooks not installed. Install lefthook (in a frontend project it comes with bun install) and after git init run lefthook install in the project (or bunx lefthook install)" >&2; fi'

[[questions]]
name = "project_name"
type = "str"
help = "Project name in kebab-case (Latin letters, digits, hyphen). Package names derive from it: `<name>-<crate>` and `@<name>/<package>`"
validator = "{% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %} The name is kebab-case: a lowercase Latin letter, then lowercase letters, digits, hyphens {% endif %}"

[[questions]]
name = "rust"
type = "bool"
default = true
help = "Rust in the project?"

[[questions]]
name = "frontend"
type = "bool"
default = true
help = "Frontend (React SPA on Vite) in the project?"
validator = "{% if not rust and not frontend %} At least Rust or frontend is required {% endif %}"

# With Rust and frontend together the question is not asked: it is always a
# monorepo. A question with a false `when` takes its value from `default`.
[[questions]]
name = "monorepo"
type = "bool"
default = true
when = "not (rust and frontend)"
help = "Monorepo (Cargo workspace in crates/, frontend in apps/ and packages/)? Otherwise a single crate or a single app at the root"
validator = "{% if rust and frontend and not monorepo %} Rust and frontend together — monorepo only {% endif %}"

[[questions]]
name = "linear"
type = "bool"
default = false
help = "Enable the Linear module (issues, issue number in the PR title)?"

[[questions]]
name = "tracker_prefix"
type = "str"
when = "linear"
help = "Linear issue prefix, uppercase Latin letters (for example, DEN)"
validator = "{% if not (tracker_prefix | regex_search('^[A-Z]+$')) %} The prefix is uppercase Latin letters only {% endif %}"

[[questions]]
name = "orca"
type = "bool"
default = true
help = "Enable the Orca module (a worktree per session via orca worktree)?"

[[questions]]
name = "telegram"
type = "bool"
default = false
when = "rust"
help = "Enable the telegram-bot skill for the Rust executor?"

# Agents talk to the owner in chat in this language; everything else (artifacts,
# code comments, commits, PRs, the knowledge journal) is written in English.
[[questions]]
name = "chat_language"
type = "str"
default = "Russian"
help = "The language agents use when talking to the owner in chat; everything else is English"
validator = "{% if not chat_language %} Specify a language {% endif %}"

# Agent models in Pi: the Claude Code agent model class (`model:` in
# `.claude/agents/`) → Pi model id `provider/model` (`pi --list-models`).
# A mapping rather than hardcoded strings: providers differ between projects.
# Default — Anthropic models via OpenRouter.
[[questions]]
name = "pi_models"
type = "yaml"
help = "Agent models in Pi: mapping opus/sonnet/haiku → Pi model `provider/model` (pi --list-models)"
validator = """
{% if pi_models is not mapping
   or pi_models.opus is not string or not pi_models.opus
   or pi_models.sonnet is not string or not pi_models.sonnet
   or pi_models.haiku is not string or not pi_models.haiku %}
A mapping with keys opus, sonnet, haiku and Pi models as strings is required {% endif %}"""

[questions.default]
opus = "openrouter/anthropic/claude-opus-5.5"
sonnet = "openrouter/anthropic/claude-sonnet-5.5"
haiku = "openrouter/anthropic/claude-haiku-5.5"

[[questions]]
name = "doc_form"
type = "choice"
default = "catalog"
help = "Document form"

[[questions.choices]]
label = "catalog — spec as a directory, revisions, decisions and lessons one per file (new project)"
value = "catalog"

[[questions.choices]]
label = "monolith — spec and journals as single files (existing project)"
value = "monolith"

[[questions]]
name = "spec_path"
type = "str"
default = "{% if doc_form == 'catalog' %}docs/spec{% endif %}"
help = "Path to the spec from the project root (a directory in the catalog form, a file in the monolith form)"
validator = "{% if not spec_path %} Specify a path {% endif %}"

[[questions]]
name = "revisions_path"
type = "str"
default = "{% if doc_form == 'catalog' %}docs/spec/revisions{% endif %}"
help = "Path to the spec revisions journal (a directory in the catalog form, a file in the monolith form)"
validator = "{% if not revisions_path %} Specify a path {% endif %}"

[[questions]]
name = "decisions_path"
type = "str"
default = "{% if doc_form == 'catalog' %}knowledge/decisions{% endif %}"
help = "Path to the decisions journal (a directory in the catalog form, a file in the monolith form)"
validator = "{% if not decisions_path %} Specify a path {% endif %}"

[[questions]]
name = "lessons_path"
type = "str"
default = "{% if doc_form == 'catalog' %}knowledge/lessons{% endif %}"
help = "Path to lessons (a directory in the catalog form, a file in the monolith form)"
validator = "{% if not lessons_path %} Specify a path {% endif %}"

[[questions]]
name = "open_questions_path"
type = "str"
default = "{% if doc_form == 'catalog' %}knowledge/open-questions.md{% endif %}"
help = "Path to the open questions file"
validator = "{% if not open_questions_path %} Specify a path {% endif %}"

# The table is read by `knowledge/due.sh`: open question deadlines "Due: stage N"
# are checked against the stage states. In the catalog form the table lives in
# the stages section of the spec.
[[questions]]
name = "stages_path"
type = "str"
default = "{% if doc_form == 'catalog' %}{{ spec_path }}/03-stages.md{% endif %}"
help = "Path to the file with the stage state table (`| N. Title | state |`, states `in progress`, `closed`)"
validator = "{% if not stages_path %} Specify a path {% endif %}"
