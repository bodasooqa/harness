# Project CI. Shared checks live in `harness.yml` (managed, updated by the
# template); the project writes its own jobs here, next to the call.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A run is stale as soon as the next commit lands on the branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    uses: ./.github/workflows/harness.yml
    permissions:
      contents: read
      pull-requests: read
    # Custom runner: a label string or a JSON array of labels. A shared rust or
    # js job (the inputs exist if the project chose them) that needs its own
    # environment (a database, variables) is turned off by the project, which
    # writes its own below.
    # with:
    #   runs-on: '["self-hosted", "ci"]'
    #   rust: false
    #   js: false

  # The project's own jobs go below.
