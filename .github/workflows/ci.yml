# CI of the template itself: each layout is generated by `rootstock new` and checked
# by `scripts/check-layouts.sh --only <layout>` — the same script that runs on the
# owner's machine. Plus `scripts/check-update.sh` — updating a project with
# edits, `scripts/check-lefthook.sh` on Windows — the project's git hooks in Git
# Bash, and lint of the repository's scripts and workflows.
#
# Tools at pinned versions, as on the owner's machine: differing versions give
# different linter remarks, and what is green locally turns red in CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A PR run is stale as soon as the next commit reaches the branch. A main run
# is per commit: release.yml sets the tag on its green CI, and a cancelled run
# would leave the commit without a tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUN_VERSION: 1.3.14
  OPENSPEC_VERSION: 1.12.0
  SHELLCHECK_VERSION: 0.11.0
  ACTIONLINT_VERSION: 1.7.12
  # The same version as in scripts/check-layouts.sh.
  LEFTHOOK_VERSION: 2.1.12
  # The same as `@biomejs/biome` in the template's package.json: the root config
  # extends the template's, and config keys change from version to version.
  BIOME_VERSION: 2.5.12

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lint-tools
        with:
          shellcheck-version: ${{ env.SHELLCHECK_VERSION }}
          actionlint-version: ${{ env.ACTIONLINT_VERSION }}

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x scripts/*.sh

      # actionlint calls shellcheck on run: blocks — the one installed above.
      - name: actionlint
        run: |
          actionlint --version
          actionlint .github/workflows/*.yml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # JS/TS/JSON files of template/ — in the generated project's style: the root
      # biome.json extends the template's `.harness/biome.json`.
      - name: biome
        run: bunx "@biomejs/biome@$BIOME_VERSION" check .

  # rootstock update on a project with edits: own lines in managed files and
  # deleted starter files survive the update.
  update:
    name: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rootstock

      - name: openspec
        run: npm install --global "@fission-ai/openspec@$OPENSPEC_VERSION"

      - name: check-update.sh
        run: scripts/check-update.sh

  # Windows in Git Bash: the project's git hooks (commit and push through lefthook,
  # pre-push without and with an upstream), knowledge/ tests, line endings. The
  # layout stack isn't built here — it's the same on every system and slow on Windows.
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rootstock

      # Without install scripts: lefthook's postinstall installs hooks into the
      # current repository, and the binary comes from an optional dependency anyway.
      - name: lefthook
        run: npm install --global --ignore-scripts "lefthook@$LEFTHOOK_VERSION"

      - name: Versions
        run: |
          rootstock --version
          lefthook version
          git --version
          bash --version | head -n 1
          perl -e 'print "perl $^V\n"'

      - name: check-lefthook.sh
        run: scripts/check-lefthook.sh

  layouts:
    name: ${{ matrix.layout }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A red layout must not hide the state of the others.
      fail-fast: false
      matrix:
        layout: [full, rust-workspace, rust-crate, web-monorepo, web-app, monolith]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/lint-tools
        with:
          shellcheck-version: ${{ env.SHELLCHECK_VERSION }}
          actionlint-version: ${{ env.ACTIONLINT_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # openspec — for the template hook `openspec init` on rootstock new.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: ./.github/actions/rootstock

      - name: openspec
        run: npm install --global "@fission-ai/openspec@$OPENSPEC_VERSION"

      # The project's toolchain comes from its rust-toolchain.toml (stable); the same
      # channel is installed here in advance so the version is in the cache key.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Versions
        id: versions
        run: |
          rootstock --version
          bun --version
          openspec --version
          rustc --version
          shellcheck --version | sed -n 2p
          actionlint --version | head -n 1
          jq --version
          # awk dialect: it may differ between GitHub runners and projects' own
          # runners (gawk, mawk), and harness scripts must work with both.
          readlink -f "$(command -v awk)"
          awk -W version 2>&1 | head -n 1
          bash --version | head -n 1
          echo "rustc=$(rustc --version | cut -d' ' -f2)" >>"$GITHUB_OUTPUT"

      # The Rust build directory outside the script's temporary directory — so it
      # can be cached; check-layouts.sh takes CARGO_TARGET_DIR from the
      # environment if set.
      - name: Build directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target" >>"$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/cargo-target
            ~/.bun/install/cache
          key: layout-${{ matrix.layout }}-rust${{ steps.versions.outputs.rustc }}-${{ hashFiles('template/**/Cargo.toml*', 'template/**/package.json*') }}
          restore-keys: |
            layout-${{ matrix.layout }}-rust${{ steps.versions.outputs.rustc }}-

      - name: check-layouts.sh --only ${{ matrix.layout }}
        run: scripts/check-layouts.sh --only "${{ matrix.layout }}"
