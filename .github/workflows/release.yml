# Automatic tag after a merge into main. The tag is set only on a commit with
# green CI: the workflow fires on CI completion (`workflow_run`) of a push run
# on main and does nothing if CI isn't green.
#
# Bump kind — by the label of this commit's merged PR:
#   release:minor          → minor;
#   release:patch, no label → patch;
#   release:none           → no tag;
#   release:major          → no tag, a warning in the summary: a major is set
#                            manually, with a migration note in CHANGELOG.md.
# The first tag is v0.1.0. The tag and a GitHub Release with generated notes are
# created by `gh release create --generate-notes` with GITHUB_TOKEN.
#
# Idempotent: a commit that already has a tag isn't tagged a second time.
# A commit not ahead of the latest tag (an old commit's CI finished after a
# newer one's) is skipped: its changes are already in the newer tag.
name: release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Tags are set one at a time: two parallel runs would take the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  tag:
    name: tag
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Tag and release
        run: |
          set -euo pipefail

          say() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          # Already tagged — do nothing.
          existing=$(gh api --paginate "repos/$REPO/tags" \
            --jq ".[] | select(.commit.sha == \"$SHA\") | .name")
          if [ -n "$existing" ]; then
            say "Commit \`$SHA\` is already tagged: $(echo "$existing" | tr '\n' ' ')— no tag needed."
            exit 0
          fi

          # Label of this commit's merged PR.
          merged=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0] // {} | {number, labels: [.labels[]?.name]}')
          pr=$(jq -r '.number // empty' <<<"$merged")
          labels=$(jq -r '.labels[]' <<<"$merged")
          has() { printf '%s\n' "$labels" | grep -qx "$1"; }

          if has release:major; then
            echo "::warning title=Major version::PR #$pr is labeled release:major — no automatic tag."
            {
              echo "### Major version — manual"
              echo
              echo "PR #$pr is labeled \`release:major\`. No automatic tag: a major is set manually,"
              echo "with a migration note in \`CHANGELOG.md\` (the steps projects need to take)."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if has release:none; then
            say "PR #$pr is labeled \`release:none\` — no tag."
            exit 0
          fi
          bump="patch"
          has release:minor && bump="minor"

          # The latest vX.Y.Z version among the tags.
          last=$(gh api --paginate "repos/$REPO/tags" --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$last" ]; then
            next=v0.1.0
          else
            status=$(gh api "repos/$REPO/compare/$last...$SHA" --jq .status)
            if [ "$status" != ahead ]; then
              say "Commit \`$SHA\` is not ahead of $last (comparison: $status) — no tag."
              exit 0
            fi
            IFS=. read -r major minor patch <<<"${last#v}"
            case "$bump" in
              minor) next="v$major.$((minor + 1)).0" ;;
              patch) next="v$major.$minor.$((patch + 1))" ;;
            esac
          fi

          gh release create "$next" --repo "$REPO" --target "$SHA" \
            --title "$next" --generate-notes
          say "Tagged $next ($bump${pr:+, PR #$pr}) on \`$SHA\`."
