# shellcheck and actionlint at pinned versions — as on the owner's machine:
# different versions give different remarks, and what is green locally turns red in CI.
name: lint-tools
description: Installs shellcheck and actionlint of the given versions into PATH

inputs:
  shellcheck-version:
    description: shellcheck version without the v prefix
    required: true
  actionlint-version:
    description: actionlint version without the v prefix
    required: true

runs:
  using: composite
  steps:
    - name: shellcheck and actionlint
      shell: bash
      env:
        SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
        ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/lint-tools"
        mkdir -p "$bin"
        curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
          | tar -xJ -C "$bin" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
        curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
          | tar -xz -C "$bin" actionlint
        echo "$bin" >>"$GITHUB_PATH"
